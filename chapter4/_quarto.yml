project:
  type: book
  output-dir: _book
  resources:
    - laserlib.py
    - laser_sim.js
    - notebooks/*.ipynb

book:
  title: "Stimulated Emission Devices: Optical Amplifiers and Lasers"
  subtitle: "An interactive companion to Chapter 4 — Basics of Optoelectronics"
  author: "Philippe Velha"
  date: today
  search: true
  site-url: https://philippevelha.github.io/Optoelectronics-teaching/chapter4/
  repo-url: https://github.com/philippevelha/Optoelectronics-teaching
  repo-subdir: chapter4
  repo-actions: [source, issue]
  downloads: []
  chapters:
    - index.qmd
    - part: "Stimulated emission"
      chapters:
        - blackbody.qmd
        - einstein.qmd
        - pumping.qmd
    - part: "Optical amplifiers"
      chapters:
        - edfa.qmd
    - part: "Laser oscillators"
      chapters:
        - gas-lasers.qmd
        - threshold.qmd
        - broadening.qmd
        - pulsed.qmd
    - part: "Semiconductor lasers"
      chapters:
        - ld-principle.qmd
        - ld-structures.qmd
        - ld-efficiency.qmd
        - ld-equation.qmd
        - qw-lasers.qmd
        - single-mode.qmd
        - soa-sled.qmd
        - modulation.qmd
    - part: "Applications"
      chapters:
        - holography.qmd
    - part: "Going further"
      chapters:
        - resonators.qmd
        - linewidth-noise.qmd
    - ideas.qmd
  appendices:
    - running.qmd
    - cheatsheet.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    grid:
      body-width: 1100px
      sidebar-width: 260px
      margin-width: 220px
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show the Python"
    code-tools: true
    code-copy: true
    fig-align: center
    html-math-method: mathjax
    crossref:
      chapters: true

execute:
  freeze: auto
  warning: false

jupyter: python3
