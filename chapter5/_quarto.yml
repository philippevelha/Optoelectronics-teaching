project:
  type: book
  output-dir: _book
  resources:
    - detlib.py
    - det_sim.js
    - notebooks/*.ipynb

book:
  title: "Photodetectors and Image Sensors"
  subtitle: "An interactive companion to Chapter 5 — Basics of Optoelectronics"
  author: "Philippe Velha"
  date: today
  search: true
  site-url: https://philippevelha.github.io/Optoelectronics-teaching/chapter5/
  repo-url: https://github.com/philippevelha/Optoelectronics-teaching
  repo-subdir: chapter5
  repo-actions: [source, issue]
  downloads: []
  chapters:
    - index.qmd
    - part: "How a photodiode works"
      chapters:
        - pn-photodiode.qmd
        - ramo.qmd
        - absorption.qmd
        - responsivity.qmd
    - part: "Photodiode families"
      chapters:
        - pin.qmd
        - apd.qmd
        - schottky.qmd
        - photoconductors.qmd
    - part: "Circuits, speed and noise"
      chapters:
        - circuits.qmd
        - noise.qmd
        - apd-noise.qmd
    - part: "Image sensors and solar cells"
      chapters:
        - image-sensors.qmd
        - solar-cells.qmd
    - part: "Going further"
      chapters:
        - receivers.qmd
        - sq-limit.qmd
    - ideas.qmd
  appendices:
    - running.qmd
    - cheatsheet.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    grid:
      body-width: 1100px
      sidebar-width: 260px
      margin-width: 220px
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show the Python"
    code-tools: true
    code-copy: true
    fig-align: center
    html-math-method: mathjax
    crossref:
      chapters: true

execute:
  freeze: auto
  warning: false

jupyter: python3
